name: Setup Toolchain
description: Node + npm ci (site + functions) + pinned gitleaks (checksum verified)
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: |
          package-lock.json
          src/backend/functions/package-lock.json
    - name: Install Dependencies
      run: npm ci
      shell: bash
    - name: Install Functions Dependencies (tests mock these)
      run: npm ci --prefix src/backend/functions
      shell: bash
    # Cached: GitHub release downloads 504 now and then and failed whole runs.
    - name: Cache gitleaks
      id: gitleaks-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/gitleaks-dl
        key: gitleaks-8.28.0-linux-x64
    - name: Install gitleaks (pinned, checksum verified)
      shell: bash
      env: { V: 8.28.0, HIT: "${{ steps.gitleaks-cache.outputs.cache-hit }}" }
      run: |
        mkdir -p ~/.cache/gitleaks-dl && cd ~/.cache/gitleaks-dl
        base="https://github.com/gitleaks/gitleaks/releases/download/v$V"
        if [ "$HIT" != "true" ]; then
          curl -sSfLO --retry 8 --retry-all-errors --retry-delay 15 "$base/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfLO --retry 8 --retry-all-errors --retry-delay 15 "$base/gitleaks_${V}_checksums.txt"
        fi
        sha256sum --ignore-missing -c "gitleaks_${V}_checksums.txt"
        tar -xzf "gitleaks_${V}_linux_x64.tar.gz" -C "$RUNNER_TEMP" gitleaks
        echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
