# Quality Gates: every PR into and push to development/main. Delivery: continuous-delivery.yml.
name: Quality Gates

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Toolchain
        uses: ./.github/actions/setup
      - name: Static Analysis, Secret Scan & Tests
        run: npm run check
      - name: Dependency Vulnerability Audit
        run: npm run check:audit
      - name: Production Build
        run: npm run build
      - name: Performance Budget
        run: npm run test:perf

  security-rules:
    name: Security Rules Tests
    needs: code-quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Toolchain
        uses: ./.github/actions/setup
      - name: Setup Java (Firebase Emulators)
        uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21' }
      - name: Firestore & Storage Rules on Emulators
        run: npm run test:rules

  e2e:
    name: End-to-End Tests
    needs: code-quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Toolchain
        uses: ./.github/actions/setup
      - name: Install Browser
        run: npx playwright install --with-deps chromium
      - name: Playwright Smoke Suite
        run: npm run test:e2e
      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v7
        with: { name: e2e-test-results, path: test-results, retention-days: 7 }
