# gitleaks: default rules + skip generated/vendor paths and the git-ignored .env.local (history scans still cover commits).
[extend]
useDefault = true

[allowlist]
paths = [
  '''(^|[\\/])(node_modules|dist|\.wrangler|test-results|playwright-report|coverage)([\\/]|$)''',
  '''(^|[\\/])\.env\.local$''',
  '''package-lock\.json$''',
  '''\.(png|jpe?g|webp|gif|ico)$''',
]
